name: Trading Council Session

# Cron times are UTC, calibrated for US Eastern Daylight Time (EDT, UTC-4):
# 09:50 ET, 11:00 ET, 15:00 ET. During EST (UTC-5, roughly Nov-Mar) these
# fire about an hour early ET — harmless, since bot-core.js checks
# isTradingOpen() and no-ops with no side effects if the market isn't open
# yet, rather than guessing at data that doesn't exist.
on:
  schedule:
    - cron: '50 13 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '0 19 * * 1-5'
  workflow_dispatch:
    inputs:
      bootstrap_placeholder:
        description: 'Deploy a one-time honest "no session yet" placeholder instead of running a real session (used once to trigger GitHub Pages domain verification/cert issuance before the first real market-hours run)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two sessions overlap on the same data files.
concurrency:
  group: trading-council-session
  cancel-in-progress: false

jobs:
  run-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Run council session (recommendation-only, no order ever placed)
        if: github.event.inputs.bootstrap_placeholder != 'true'
        env:
          MARKET_DATA_KEY: ${{ secrets.MARKET_DATA_KEY }}
          MARKET_DATA_SECRET: ${{ secrets.MARKET_DATA_SECRET }}
          MARKET_DATA_BASE_URL: ${{ secrets.MARKET_DATA_BASE_URL }}
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          TOTAL_BUDGET: ${{ secrets.TOTAL_BUDGET }}
          WEEKLY_TARGET: ${{ secrets.WEEKLY_TARGET }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node bot.js

      # One-time bootstrap: GitHub doesn't start domain verification / cert
      # issuance for a custom Pages domain until the first real deployment
      # happens. This writes a plainly-honest status page (no trade data,
      # real or fabricated) purely so that first deployment can occur before
      # the next real market-hours session.
      - name: Write bootstrap placeholder
        if: github.event.inputs.bootstrap_placeholder == 'true'
        run: |
          mkdir -p report
          cat > report/index.html <<'HTML'
          <!DOCTYPE html>
          <html><body style="margin:0; padding:0; background:#f3f4f6; font-family:Arial,Helvetica,sans-serif;">
          <div style="max-width:600px; margin:60px auto; padding:24px; background:#fff; border:1px solid #e5e7eb; border-radius:8px; text-align:center;">
            <div style="font-size:18px; font-weight:700; color:#111827; margin-bottom:8px;">4-Agent Trading Council</div>
            <div style="font-size:14px; color:#6b7280; margin-bottom:16px;">No session has run during market hours yet.</div>
            <div style="font-size:13px; color:#9ca3af;">This page is set up and waiting — recommendations will appear here after the next weekday session (9:50am / 11am / 3pm ET).</div>
          </div>
          </body></html>
          HTML

      - name: Persist council.db + analytics.json back to the repo
        run: |
          git config user.name "trading-council-bot"
          git config user.email "actions@users.noreply.github.com"
          git add council/council.db analytics.json
          git diff --staged --quiet || git commit -m "Session data update [skip ci]"
          git push

      # report/index.html only gets written when the market was actually
      # open this run (see bot-core.js runSession) — on a closed-market run
      # there's nothing new to publish, so skip Pages entirely rather than
      # fail on a missing directory or overwrite the last real report with
      # a placeholder.
      - name: Check whether a fresh report was generated
        id: report_check
        run: |
          if [ -f report/index.html ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.report_check.outputs.exists == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload report artifact
        if: steps.report_check.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

      - name: Deploy to GitHub Pages
        if: steps.report_check.outputs.exists == 'true'
        uses: actions/deploy-pages@v4
