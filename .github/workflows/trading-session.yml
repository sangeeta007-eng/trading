name: Trading Council Session

# Cron times are UTC. IMPORTANT: these are request times, not run times.
# GitHub queues scheduled workflows on shared runners and has been firing
# this one 2.5-3.6 hours late, every day, consistently — measured across
# every scheduled run since 2026-08-04:
#     50 13 -> fires ~17:16-17:27 UTC (~1:20pm ET)
#     0  15 -> fires ~18:16-18:29 UTC (~2:25pm ET)
#     0  19 -> fires ~21:27-21:31 UTC (~5:30pm ET)  <- AFTER THE 4pm CLOSE
# The third slot was therefore dead: bot-core.js correctly no-ops when
# isTradingOpen() is false, so it burned a run and produced nothing every
# single day. Moved to 16:00, which lands inside market hours (13:30-20:00
# UTC) across the entire observed delay range — on time it is 12:00pm ET, at
# the worst observed delay it is ~3:36pm ET, still before the close.
#
# Do not "correct" these back to the nominal ET times they look like they
# should be. The delay is real and the schedule is calibrated around it.
# During EST (UTC-5, roughly Nov-Mar) everything shifts an hour earlier ET,
# which stays comfortably in-window.
on:
  schedule:
    - cron: '50 13 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '0 16 * * 1-5'
  workflow_dispatch:
    inputs:
      bootstrap_placeholder:
        description: 'Deploy a one-time honest "no session yet" placeholder instead of running a real session (used once to trigger GitHub Pages domain verification/cert issuance before the first real market-hours run)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two sessions overlap on the same data files.
concurrency:
  group: trading-council-session
  cancel-in-progress: false

jobs:
  run-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Run council session (recommendation-only, no order ever placed)
        if: github.event.inputs.bootstrap_placeholder != 'true'
        env:
          MARKET_DATA_KEY: ${{ secrets.MARKET_DATA_KEY }}
          MARKET_DATA_SECRET: ${{ secrets.MARKET_DATA_SECRET }}
          MARKET_DATA_BASE_URL: ${{ secrets.MARKET_DATA_BASE_URL }}
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          TOTAL_BUDGET: ${{ secrets.TOTAL_BUDGET }}
          WEEKLY_TARGET: ${{ secrets.WEEKLY_TARGET }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node bot.js

      # One-time bootstrap: GitHub doesn't start domain verification / cert
      # issuance for a custom Pages domain until the first real deployment
      # happens. This writes a plainly-honest status page (no trade data,
      # real or fabricated) purely so that first deployment can occur before
      # the next real market-hours session.
      - name: Write bootstrap placeholder
        if: github.event.inputs.bootstrap_placeholder == 'true'
        run: |
          mkdir -p report
          cat > report/index.html <<'HTML'
          <!DOCTYPE html>
          <html><body style="margin:0; padding:0; background:#f3f1ea; font-family:Verdana, Tahoma, Arial, Helvetica, sans-serif;">
          <div style="max-width:600px; margin:60px auto; padding:28px; background:#fdfbf6; border:1px solid #e6e0d4; border-radius:8px; text-align:center; letter-spacing:0.15px;">
            <div style="font-size:19px; font-weight:700; color:#2b2723; margin-bottom:10px; line-height:1.4;">4-Agent Trading Council</div>
            <div style="font-size:15px; color:#6b6358; margin-bottom:16px; line-height:1.6;">No session has run during market hours yet.</div>
            <div style="font-size:14px; color:#6b6358; line-height:1.6;">This page is set up and waiting — recommendations will appear here after the next weekday session (9:50am / 11am / 3pm ET).</div>
          </div>
          </body></html>
          HTML

      - name: Persist council.db + analytics.json back to the repo
        run: |
          git config user.name "trading-council-bot"
          git config user.email "actions@users.noreply.github.com"
          git add council/council.db analytics.json
          git diff --staged --quiet || git commit -m "Session data update [skip ci]"
          git push

      # report/index.html only gets written when the market was actually
      # open this run (see bot-core.js runSession) — on a closed-market run
      # there's nothing new to publish, so skip Pages entirely rather than
      # fail on a missing directory or overwrite the last real report with
      # a placeholder.
      - name: Check whether a fresh report was generated
        id: report_check
        run: |
          if [ -f report/index.html ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.report_check.outputs.exists == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload report artifact
        if: steps.report_check.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

      - name: Deploy to GitHub Pages
        if: steps.report_check.outputs.exists == 'true'
        uses: actions/deploy-pages@v4
